name: Pull request builds

# Builds pull requests for all platforms with the same build script as
# Jenkins (.ci/build.sh). Dev branch builds are only made for pull requests
# with the "dev branch" label.
#
# The label name is also used in the concurrency group below, so keep both
# in sync when renaming it.
#
# Outside of pull requests, this workflow refreshes the cached MacPorts
# installations used by the macOS builds. Only caches saved on master are
# available to all pull requests, so pull request builds never save one.

on:

  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - .ci/**
      - .github/actions/setup-macports/**
      - .github/workflows/pr_builds.yml
      - vcpkg.json
      - "!**/Makefile*"

  push:
    branches:
      - master
    paths:
      - .ci/dependencies_macports.txt
      - .github/actions/setup-macports/**

  schedule:
    - cron: "0 3 1 * *"

  workflow_dispatch:

# Cancel superseded runs for the same pull request. Adding any label other
# than the dev branch one does not build anything, so it gets a unique group
# so as to not cancel a build in progress, as do other events.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.action != 'labeled' || github.event.label.name == 'dev branch') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # Determine the build ID once, so that it is the same across all builds of
  # this run (including re-runs of failed builds, which reuse this output)
  prepare:

    name: Prepare build ID

    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'labeled' || github.event.label.name == 'dev branch')

    runs-on: ubuntu-latest

    outputs:
      build_id: ${{ steps.build_id.outputs.build_id }}

    steps:
      - name: Determine build ID
        id: build_id
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "build_id=pr$PR_NUMBER.$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

  build:

    name: "${{ matrix.target.os }} ${{ matrix.target.arch }} ${{ matrix.preset }}"

    needs: prepare

    runs-on: ${{ matrix.target.runner }}

    defaults:
      run:
        shell: ${{ matrix.target.shell }}

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(contains(github.event.pull_request.labels.*.name, 'dev branch') && '["Regular", "Dev"]' || '["Regular"]') }}
        target:
          - os: Windows
            arch: "64"
            msystem: UCRT64
            runner: windows-2022
            shell: msys2 {0}
          - os: Windows
            arch: ARM64
            msystem: CLANGARM64
            runner: windows-11-arm
            shell: msys2 {0}
          - os: Linux
            arch: x86_64
            runner: ubuntu-26.04
            shell: bash
          - os: Linux
            arch: arm64
            runner: ubuntu-26.04-arm
            shell: bash
          # Jenkins makes a single universal build, which requires both a
          # native and an Intel MacPorts installation on one machine. Build
          # each architecture on its own runner instead. Keep these in sync
          # with the MacPorts cache job below.
          - os: macOS
            arch: x86_64
            runner: macos-15-intel
            shell: bash
          - os: macOS
            arch: arm64
            runner: macos-15
            shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare MSYS2 environment
        if: matrix.target.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 #v2.32.0
        with:
          release: true
          update: true
          msystem: ${{ matrix.target.msystem }}
          install: >-
            git
            make

      # build.sh packages Windows builds with the 7-Zip from Program Files
      - name: Install 7-Zip
        if: matrix.target.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            choco install 7zip -y --no-progress
          }

      - name: Set up MacPorts
        if: matrix.target.os == 'macOS'
        uses: ./.github/actions/setup-macports
        with:
          arch: ${{ matrix.target.arch }}

      # Only fixed strings and the build ID (made of the pull request number
      # and a timestamp) end up in the build.sh arguments, as it evaluates its
      # CMake flags with eval.
      - name: Build
        id: build
        env:
          OS: ${{ matrix.target.os }}
          ARCH: ${{ matrix.target.arch }}
          PRESET: ${{ matrix.preset }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          case $PRESET in
            Regular)
              slug=
              preset_flags="-t --preset=regular -D CMAKE_BUILD_TYPE=Release"
              ;;
            Dev)
              slug=-Dev
              preset_flags="-t --preset=development -D CMAKE_BUILD_TYPE=Release"
              ;;
          esac

          package="86Box$slug-$OS-$ARCH-$BUILD_ID"
          echo "package=$package" >> "$GITHUB_OUTPUT"

          mkdir -p _output
          cd _output
          status=0
          sh ../.ci/build.sh -b "$package" "$ARCH" $preset_flags \
            -D DYNAREC=ON -D QT=ON \
            -D BUILD_TYPE=alpha -D "EMU_BUILD=GitHub build $BUILD_ID" || status=$?

          # Like on Jenkins, status 50 means the macOS build succeeded but
          # could not be notarized
          if [ $status -eq 50 ]; then
            echo "::warning::The macOS build was not notarized."
          elif [ $status -ne 0 ]; then
            exit $status
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: _output/${{ steps.build.outputs.package }}.*
          archive: false
          if-no-files-found: error

  # Set up MacPorts from scratch and make a regular build, which installs all
  # dependencies listed for build.sh, then save the installation for the
  # macOS pull request builds
  macports-cache:

    name: "MacPorts cache, macOS ${{ matrix.arch }}"

    if: github.event_name != 'pull_request'

    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MacPorts
        id: macports
        uses: ./.github/actions/setup-macports
        with:
          arch: ${{ matrix.arch }}
          restore: false

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p _output
          cd _output
          status=0
          sh ../.ci/build.sh -b "86Box-macOS-$ARCH-cache" "$ARCH" -t --preset=regular -D CMAKE_BUILD_TYPE=Release \
            -D DYNAREC=ON -D QT=ON -D BUILD_TYPE=alpha || status=$?
          if [ $status -ne 0 ] && [ $status -ne 50 ]; then
            exit $status
          fi

      - name: Pack installation
        env:
          TARBALL: ${{ steps.macports.outputs.tarball }}
        run: >-
          sudo tar -C / -cf "$TARBALL"
          --exclude opt/local/var/macports/build
          --exclude opt/local/var/macports/distfiles
          --exclude opt/local/var/macports/logs
          opt/local

      - name: Save installation
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.macports.outputs.tarball }}
          key: ${{ steps.macports.outputs.cache-key-prefix }}${{ github.run_id }}
