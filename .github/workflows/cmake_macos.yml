name: CMake (macos)

# Compile checks for the configurations the pull request builds (made with
# .ci/build.sh) don't cover.
#
# Pull requests and pushes build a reduced matrix, only building Qt 5 on
# arm64, as macOS runners are scarce. Manual runs (with the full matrix
# option) and the weekly scheduled run build every configuration.

on:

  push:
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_macos.yml
      - vcpkg.json
      - "!**/Makefile*"

  pull_request:
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_macos.yml
      - vcpkg.json
      - "!**/Makefile*"

  schedule:
    - cron: "0 5 * * 0"

  workflow_dispatch:
    inputs:
      full_matrix:
        description: Build every configuration instead of the reduced pull request matrix
        type: boolean
        default: true

# Cancel superseded runs for the same pull request. Other events get a
# unique group so that they are never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  macos:

    name: "${{ matrix.ui.name }}, ${{ matrix.build.name }}, ${{ matrix.environment.arch }}"

    runs-on: ${{ matrix.environment.runner }}

    strategy:
      fail-fast: true
      matrix:
        build:
#          - name: Regular
#            preset: regular
          - name: Debug
            preset: dev_debug
            slug: -Debug
          - name: Dev
            preset: development
            slug: -Dev
        ui:
          - name: SDL GUI
            qt: off
            slug: -SDL
            static: on
          - name: Qt 5 GUI
            qt: on
            slug: -Qt5
            packages: >-
              qt@5
        environment:
          - arch: x86_64
            slug: -x86_64
            runner: macos-15-intel
          - arch: arm64
            slug: -arm64
            runner: macos-15
        # Only build Qt 5 on arm64, as macOS runners are scarce. The CodeQL
        # workflow builds Qt 5 Debug on x86_64.
        exclude: >-
          ${{ fromJSON((github.event_name == 'schedule' || inputs.full_matrix) && '[]' || '[{"environment": {"arch": "x86_64"}}, {"ui": {"name": "SDL GUI"}}]') }}

    steps:
      - name: Install dependencies
        run: >-
          brew install
          sdl3
          rtmidi
          openal-soft
          fluidsynth
          libslirp
          vde
          libserialport
          vulkan-headers
          zstd
          ${{ matrix.ui.packages }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          -D QT=${{ matrix.ui.qt }}
          -D Qt5_ROOT=$(brew --prefix qt@5)
          -D Qt5LinguistTools_ROOT=$(brew --prefix qt@5)
          -D OpenAL_ROOT=$(brew --prefix openal-soft)
          -D LIBSERIALPORT_ROOT=$(brew --prefix libserialport)

      - name: Build
        run: cmake --build build

      - name: Generate package
        run: cmake --install build

      # Only manual runs upload their builds, as the pull request builds
      # workflow provides builds for pull requests
      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: '86Box${{ matrix.ui.slug }}${{ matrix.build.slug }}-macOS${{ matrix.environment.slug }}-gha${{ github.run_number }}'
          path: build/artifacts/**
          retention-days: 7
