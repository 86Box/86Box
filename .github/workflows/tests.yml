name: Tests

# Builds the tests in tests/ and runs them with CTest, on the systems and
# architectures the CMake workflows build for. Only the test targets are
# built, not 86Box itself, which the CMake workflows already cover. The build
# keeps going past test targets that fail to compile, and CTest reports those
# as not built.
#
# Tests that fail on master are listed in tests/known_failures (see the README
# there). .ci/run_tests.sh reports their failures as warnings; any other
# failing test fails the job.
#
# The architectures marked manual are only built on manual runs with the full
# matrix option, as in the CMake workflows.

on:

  push:
    paths:
      - src/**
      - tests/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/actions/setup-msys2/**
      - .github/workflows/tests.yml
      - .ci/run_tests.sh
      - "!**/Makefile*"

  # Closing a pull request (including merging it) starts a run that builds
  # nothing, only cancelling the run in progress through the concurrency
  # group below
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - src/**
      - tests/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/actions/setup-msys2/**
      - .github/workflows/tests.yml
      - .ci/run_tests.sh
      - "!**/Makefile*"

  workflow_dispatch:
    inputs:
      full_matrix:
        description: Test every architecture, including the ones marked manual
        type: boolean
        default: true

# Cancel superseded runs for the same pull request. Pushes to master share
# a group too, so that while one is building, only the newest of the pushes
# after it waits instead of all of them. Other events get a unique group so
# that they are never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/master' && github.event_name == 'push' && 'master') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  linux:

    name: "Linux, ${{ matrix.environment.arch }}"

    if: github.event.action != 'closed'

    runs-on: ${{ matrix.environment.runner }}

    # Don't let a hung test hold a runner for hours
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        environment:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Install dependencies
        run: >-
          sudo apt update && sudo apt install
          build-essential
          ninja-build
          libfreetype-dev
          libgles2-mesa-dev
          libsdl3-dev
          libpng-dev
          libc6-dev
          librtmidi-dev
          libopenal-dev
          libslirp-dev
          libfluidsynth-dev
          libvdeplug-dev
          libserialport-dev
          libzstd-dev
          libvulkan-dev
          libgtest-dev

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset development
          -D QT=OFF
          -D BUILD_TESTING=ON

      # A test target that doesn't compile fails its tests in the next step,
      # which tells known failures from new ones, so this step only warns
      - name: Build tests
        run: >-
          cmake --build build --target tests/all -- -k 0 ||
          echo "::warning title=Build::Some test targets don't build, their tests are reported as not built in the next step"

      - name: Run tests
        run: .ci/run_tests.sh build linux ${{ matrix.environment.arch }}

  windows:

    name: "Windows, ${{ matrix.environment.msystem }}"

    if: github.event.action != 'closed'

    runs-on: ${{ matrix.environment.runner }}

    timeout-minutes: 60

    defaults:
      run:
        shell: msys2 {0}

    strategy:
      fail-fast: false
      matrix:
        environment:
          - msystem: UCRT64
            arch: x86_64
            runner: windows-2022
          - msystem: CLANGARM64
            arch: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare MSYS2 environment
        uses: ./.github/actions/setup-msys2
        with:
          msystem: ${{ matrix.environment.msystem }}

      # Not in the shared package list, so that the builds keep sharing
      # its package cache
      - name: Install GoogleTest
        run: pacman -S --noconfirm --needed "${MINGW_PACKAGE_PREFIX}-gtest"

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset development
          -D QT=OFF
          -D BUILD_TESTING=ON

      - name: Build tests
        run: >-
          cmake --build build --target tests/all -- -k 0 ||
          echo "::warning title=Build::Some test targets don't build, their tests are reported as not built in the next step"

      - name: Run tests
        run: .ci/run_tests.sh build windows ${{ matrix.environment.arch }}

  macos:

    name: "macOS, ${{ matrix.environment.arch }}"

    if: github.event.action != 'closed'

    runs-on: ${{ matrix.environment.runner }}

    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        environment:
          - arch: x86_64
            runner: macos-15-intel
            manual: true
          - arch: arm64
            runner: macos-15
        # A missing manual key matches false, so full matrix runs exclude
        # 'never', which no entry has, instead
        exclude:
          - environment:
              manual: ${{ !inputs.full_matrix || 'never' }}

    steps:
      - name: Install dependencies
        run: >-
          brew install
          sdl3
          rtmidi
          openal-soft
          fluidsynth
          libslirp
          vde
          libserialport
          vulkan-headers
          zstd
          googletest

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset development
          -D QT=OFF
          -D BUILD_TESTING=ON
          -D OpenAL_ROOT=$(brew --prefix openal-soft)
          -D LIBSERIALPORT_ROOT=$(brew --prefix libserialport)

      - name: Build tests
        run: >-
          cmake --build build --target tests/all -- -k 0 ||
          echo "::warning title=Build::Some test targets don't build, their tests are reported as not built in the next step"

      - name: Run tests
        run: .ci/run_tests.sh build macos ${{ matrix.environment.arch }}
