name: CMake (Windows)

# Compile checks for the configurations the pull request builds (made with
# .ci/build.sh) don't cover.
#
# Pull requests and pushes build a reduced matrix, leaving out the UCRT64
# Debug build, which the CodeQL workflow already makes (though with a shared
# Qt). Manual runs (with the full matrix option) and the weekly scheduled run
# build every configuration.

on:

  push:
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/actions/setup-msys2/**
      - .github/workflows/cmake_windows_msys2.yml
      - vcpkg.json
      - "!**/Makefile*"

  pull_request:
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/actions/setup-msys2/**
      - .github/workflows/cmake_windows_msys2.yml
      - vcpkg.json
      - "!**/Makefile*"

  schedule:
    - cron: "0 5 * * 0"

  workflow_dispatch:
    inputs:
      full_matrix:
        description: Build every configuration instead of the reduced pull request matrix
        type: boolean
        default: true

# Cancel superseded runs for the same pull request. Other events get a
# unique group so that they are never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  windows:

    name: "${{ matrix.ui.name }}, ${{ matrix.build.name }}, ${{ matrix.environment.msystem }}"

    runs-on: ${{ matrix.environment.runner }}

    defaults:
      run:
        shell: msys2 {0}

    strategy:
      fail-fast: true
      matrix:
        build:
#          - name: Regular
#            preset: regular
          - name: Debug
            preset: dev_debug
            slug: -Debug
          - name: Dev
            preset: development
            slug: -Dev
        # Entries marked manual are only built on manual runs
        ui:
          - name: Qt 5 GUI
            qt: on
            qt6: off
            slug: -Qt5
            static: on
          - name: Qt 6 GUI
            qt: on
            qt6: on
            slug: -Qt6
            static: on
            manual: true
          - name: SDL GUI
            qt: off
            qt6: off
            slug: -SDL
            static: on
            manual: true
        environment:
#          - msystem: MSYS
#            slug: "-MSYS64"
#          - msystem: MINGW64
#            prefix: mingw-w64-x86_64
#            slug: "MINGW64"
#            runner: windows-2022
#          - msystem: CLANG64
#            prefix: mingw-w64-clang-x86_64
#            slug: "CLANG64"
#            runner: windows-2022
          - msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            slug: "-64"
            runner: windows-2022
          - msystem: CLANGARM64
            slug: -arm64
            runner: windows-11-arm
        # UCRT64 Debug is built by the CodeQL workflow (though with a shared
        # Qt), and the manual entries are left out of all other runs
        exclude: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.full_matrix && '[]' || '[{"build": {"name": "Debug"}, "environment": {"msystem": "UCRT64"}}]')
          || github.event_name == 'schedule' && '[{"ui": {"manual": true}}]'
          || '[{"build": {"name": "Debug"}, "environment": {"msystem": "UCRT64"}}, {"ui": {"manual": true}}]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Prepare MSYS2 environment
        uses: ./.github/actions/setup-msys2
        with:
          msystem: ${{ matrix.environment.msystem }}
          qt6: ${{ matrix.ui.qt6 == 'on' }}

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          -D QT=${{ matrix.ui.qt }}
          -D USE_QT6=${{ matrix.ui.qt6 }}

      - name: Build
        run: cmake --build build

      - name: Generate package
        run: cmake --install build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: '86Box${{ matrix.build.slug }}-Windows${{ matrix.environment.slug }}-gha${{ github.run_number }}'
          path: build/artifacts/**
