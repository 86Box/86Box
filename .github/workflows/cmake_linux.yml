name: CMake (Linux)

# Compile checks for the configurations the pull request builds (made with
# .ci/build.sh) don't cover. The builds aren't uploaded, as Linux installs
# don't bundle any libraries, so they would only run on a system matching the
# runner's Ubuntu release with all the build dependencies installed. The pull
# request builds provide usable Linux builds instead.
#
# The build types marked manual are only built on manual runs with the full
# matrix option. Among them are the x86_64 SDL and Qt 5 Dev Debug builds, which
# the CodeQL workflow already makes.

on:

  push:
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_linux.yml
      - vcpkg.json
      - "!**/Makefile*"

  # Closing a pull request (including merging it) starts a run that builds
  # nothing, only cancelling the run in progress through the concurrency
  # group below
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - src/**
      - cmake/**
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "!.github/workflows/**"
      - .github/workflows/cmake_linux.yml
      - vcpkg.json
      - "!**/Makefile*"

  schedule:
    - cron: "0 5 * * 0"

  workflow_dispatch:
    inputs:
      full_matrix:
        description: Build every configuration, including the build types marked manual
        type: boolean
        default: true

# Cancel superseded runs for the same pull request. Pushes to master share
# a group too, so that while one is building, only the newest of the pushes
# after it waits instead of all of them. Other events get a unique group so
# that they are never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/master' && github.event_name == 'push' && 'master') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  linux:

    name: "${{ matrix.ui.name }}, ${{ matrix.build.name }}, ${{ matrix.environment.arch }}"

    if: github.event.action != 'closed'

    runs-on: ${{ matrix.environment.runner }}

    strategy:
      fail-fast: true
      matrix:
        # Build types marked manual are only built on manual runs with the
        # full matrix option
        build:
#          - name: Regular
#            preset: regular
          - name: Dev Debug
            preset: dev_debug
            manual: true
          - name: Dev
            preset: development
        ui:
          - name: SDL GUI
            qt: off
            qt6: off
            sdl_shader: on
            static: on
          - name: Qt 5 GUI
            qt: on
            qt6: off
            sdl_shader: off
            packages: >-
              qtbase5-dev
              qtbase5-private-dev
              qttools5-dev
              qttranslations5-l10n
              libevdev-dev
              libxkbcommon-x11-dev
          - name: Qt 6 GUI
            qt: on
            qt6: on
            sdl_shader: off
            packages: >-
              qt6-base-dev
              qt6-base-private-dev
              qt6-tools-dev
              qt6-tools-dev-tools
              qt6-l10n-tools
              qt6-translations-l10n
              libevdev-dev
              libxkbcommon-x11-dev
              libvulkan-dev
        environment:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
        exclude:
          - build:
              manual: ${{ !inputs.full_matrix }}

    steps:
      - name: Install dependencies
        run: >-
          sudo apt update && sudo apt install
          build-essential
          ninja-build
          libfreetype-dev
          libgles2-mesa-dev
          libsdl3-dev
          libpng-dev
          libc6-dev
          librtmidi-dev
          libopenal-dev
          libslirp-dev
          libfluidsynth-dev
          libvdeplug-dev
          libserialport-dev
          libzstd-dev
          ${{ matrix.ui.packages }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          -D QT=${{ matrix.ui.qt }}
          -D USE_QT6=${{ matrix.ui.qt6 }}
          -D USE_SDL_SHADER=${{ matrix.ui.sdl_shader }}

      - name: Build
        run: |
          cmake --build build
