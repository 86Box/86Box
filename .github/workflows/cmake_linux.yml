name: Linux SDL

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CMAKE_FLAGS: >-
    -D QT=OFF
    -D USE_SDL_SHADER=ON
    -D NEW_DYNAREC=ON
    -D FLOPPY_CONTROL_SOCKET=ON
  ASSETS_REPOSITORY: https://github.com/86Box/assets.git
  MDSX_REPOSITORY: https://github.com/86Box/mdsx.git

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    name: "PR ${{ matrix.build.name }}"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        build:
          - name: Debug
            preset: debug
            slug: Debug
          - name: Release
            preset: regular
            slug: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: >-
          sudo apt update && sudo apt install -y
          build-essential
          ninja-build
          libfreetype-dev
          libgles2-mesa-dev
          libsdl2-dev
          libpng-dev
          libc6-dev
          librtmidi-dev
          libopenal-dev
          libslirp-dev
          libfluidsynth-dev
          libvdeplug-dev
          libserialport-dev
          libzstd-dev

      - name: Configure CMake
        run: >-
          cmake -S . -B build --preset ${{ matrix.build.preset }}
          $CMAKE_FLAGS

      - name: Build
        run: cmake --build build --parallel

      - name: Install package
        run: cmake --install build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 86Box-SDL-${{ matrix.build.slug }}-PR-${{ github.event.pull_request.number }}
          path: build/artifacts/**

  release-build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    name: "AppImage ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build AppImage
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: >-
          ./.ci/build.sh
          -b 86Box-SDL-${{ matrix.arch }}-${{ github.run_number }}
          ${{ matrix.arch }}
          -t
          --preset=regular
          -D QT=OFF
          -D USE_SDL_SHADER=ON
          -D NEW_DYNAREC=ON
          -D FLOPPY_CONTROL_SOCKET=ON
          -D BUILD_TYPE=release
          -D EMU_BUILD_NUM=$BUILD_NUMBER

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: 86Box-AppImage-${{ matrix.arch }}
          path: 86Box-SDL-${{ matrix.arch }}-${{ github.run_number }}.AppImage
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Publish GitHub release
    needs: release-build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download AppImages
        uses: actions/download-artifact@v4
        with:
          pattern: 86Box-AppImage-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v7.0.0-master.${{ github.run_number }}
        run: >-
          gh release create "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "$TAG"
          --notes "Automated SDL release for $GITHUB_SHA."
          release-assets/*.AppImage
