name: Set up MSYS2
description: >-
  Installs MSYS2 with msys2/setup-msys2 and every package the Windows CMake
  and CodeQL builds need, restoring the package cache populated daily by the
  MSYS2 cache workflow.

# setup-msys2 keys its package cache on its inputs except for the pacboy
# packages, so all builds use the same package list (both the static and the
# shared Qt) to not restore each other's caches. Builds made with the static
# Qt look it up in its own prefix, so the shared one doesn't get in the way.

inputs:

  msystem:
    description: MSYS2 environment to set by default (UCRT64, CLANGARM64, ...).
    required: true

  qt6:
    description: >-
      Whether to also install the static Qt 6 ("true" or "false"). As that
      would change the cached packages, the package cache isn't used then.
    default: "false"

outputs:

  msys2-location:
    description: The absolute path of the MSYS2 installation.
    value: ${{ steps.msys2.outputs.msys2-location }}

runs:

  using: composite

  steps:
    - name: Install MSYS2
      id: msys2
      uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
      with:
        release: true
        update: true
        cache: ${{ inputs.qt6 != 'true' }}
        msystem: ${{ inputs.msystem }}
        # The static Qt 6's image format plugins need libwebp and libtiff, but
        # its package doesn't install them
        pacboy: >-
          ${{ inputs.qt6 == 'true' && 'qt6-static:p libwebp:p libtiff:p' || '' }}
          ninja:p
          cmake:p
          gcc:p
          pkgconf:p
          freetype:p
          sdl3:p
          zlib:p
          libpng:p
          openal:p
          rtmidi:p
          libslirp:p
          fluidsynth:p
          libserialport:p
          qt5-static:p
          qt5-base:p
          qt5-tools:p
          vulkan-headers:p
          llvm-openmp:p
          zstd:p
